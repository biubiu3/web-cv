<div
  class="paper-table-scroll"
  role="region"
  tabindex="0"
  aria-label="{{ if eq .Page.Lang "zh" }}数据表 {{ add .Ordinal 1 }}，可横向滚动{{ else }}Data table {{ add .Ordinal 1 }}, horizontally scrollable{{ end }}"
>
  <table
    {{- range $key, $value := .Attributes }}
      {{- if $value }}
        {{- printf " %s=%q" $key $value | safeHTMLAttr }}
      {{- end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
        <tr>
          {{- range . }}
            <th scope="col"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >{{ .Text }}</th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range . }}
            <td
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >{{ .Text }}</td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
