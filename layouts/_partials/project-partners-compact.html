{{- $zh := eq .page.Lang "zh" -}}
{{- with .page.Params.project.partners -}}
<div class="project-collaborators">
  <span class="project-collaborators__label">{{ if $zh }}合作单位{{ else }}In collaboration with{{ end }}</span>
  <div class="project-collaborators__items">
  {{- range . -}}
    {{- with index hugo.Data.partners . -}}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
      <span class="project-collaborators__logo{{ if .logo_dark }} is-dark{{ end }}"><img src="{{ .logo | relURL }}" alt="" width="64" height="24" loading="lazy"></span>
      <span>{{ cond $zh .name_zh .name }}</span>
    </a>
    {{- end -}}
  {{- end -}}
  </div>
</div>
{{- end -}}
