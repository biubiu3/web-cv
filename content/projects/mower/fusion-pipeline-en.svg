<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Multi-sensor obstacle fusion pipeline</title>
  <desc id="desc">Three aligned sensor lanes combine LiDAR geometry, semantic segmentation, and object detections. Geometric hazards are protected, lawn-supported points are discarded, non-lawn evidence is filtered through detections, and an association stage produces geometry-only, class-associated, and vision-only obstacles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="lidar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#076786"/><stop offset="1" stop-color="#1894ad"/></linearGradient>
    <linearGradient id="vision" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f4bb7"/><stop offset="1" stop-color="#6954c8"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#052f4a"/><stop offset="1" stop-color="#0b677b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b3655" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b5578"/></marker>
    <style>
      .input-lidar{fill:url(#lidar);stroke:#fff;stroke-width:2;rx:16;filter:url(#shadow)}.input-vision{fill:url(#vision);stroke:#fff;stroke-width:2;rx:16;filter:url(#shadow)}.node{fill:#fff;stroke:#719bb8;stroke-width:2;rx:13;filter:url(#shadow)}.semantic{fill:#f5f2ff;stroke:#8174cf;stroke-width:2;rx:13}.geometry{fill:#eefbff;stroke:#2aa4c2;stroke-width:2;rx:13}.filter{fill:#fffaf0;stroke:#d7a844;stroke-width:2;rx:13}.discard{fill:#fff4f2;stroke:#d67868;stroke-width:2;rx:13}.assoc{fill:#eaf7ff;stroke:#2588bc;stroke-width:2.5;rx:15;filter:url(#shadow)}.output{fill:url(#result);stroke:#72d7e8;stroke-width:2;rx:16;filter:url(#shadow)}.decision{fill:#f2fbff;stroke:#26a0c1;stroke-width:2}.line{fill:none;stroke:#1b5578;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.feed{fill:none;stroke:#477795;stroke-width:2.5;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.dash{fill:none;stroke:#758b9b;stroke-width:2.3;stroke-dasharray:8 7;marker-end:url(#arrow);stroke-linejoin:round}.route-note{fill:#eef4ff;stroke:#a9bdcc;stroke-width:1.2;rx:10}.junction{fill:#fff;stroke:#1b5578;stroke-width:2}.title{font:700 25px Inter,Arial,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 25px Inter,Arial,sans-serif;fill:#14384f;text-anchor:middle}.small{font:650 21px Inter,Arial,sans-serif;fill:#294b61;text-anchor:middle}.tiny{font:600 17px Inter,Arial,sans-serif;fill:#496779;text-anchor:middle}.branch{font:750 19px Inter,Arial,sans-serif;fill:#126b8d}.group-title{font:750 19px Inter,Arial,sans-serif;letter-spacing:2px;fill:#337393}.lane{fill:none;stroke:#b7ccda;stroke-width:1.5;stroke-dasharray:6 8}
    </style>
  </defs>
  <rect width="1800" height="1120" rx="28" fill="url(#bg)"/>

  <!-- Sensor inputs remain in separate lanes -->
  <rect class="input-lidar" x="55" y="38" width="365" height="78"/><text class="title" x="237" y="86">LIDAR RESULTS</text>
  <rect class="input-vision" x="655" y="38" width="490" height="78"/><text class="title" x="900" y="86">SEMANTIC SEGMENTATION</text>
  <rect class="input-vision" x="1380" y="38" width="365" height="78"/><text class="title" x="1562" y="86">OBJECT DETECTIONS</text>
  <path class="lane" d="M475 32V990"/><path class="lane" d="M1280 32V990"/>

  <!-- Geometry gate -->
  <polygon class="decision" points="237,160 425,244 237,328 49,244"/>
  <text class="small" x="237" y="222">Pit, footprint &gt; 2 m,</text><text class="small" x="237" y="250">or height &gt; 30 cm?</text>
  <rect class="geometry" x="68" y="374" width="338" height="80"/><text class="label" x="237" y="407">Protected LiDAR obstacle</text><text class="tiny" x="237" y="436">Retain as geometric hazard</text>

  <!-- Semantic projection and three non-overlapping branches -->
  <rect class="semantic" x="545" y="170" width="710" height="78"/><text class="label" x="900" y="204">Project LiDAR into semantic mask</text><text class="tiny" x="900" y="231">Evaluate lawn and non-lawn support</text>
  <rect class="semantic" x="515" y="320" width="220" height="92"/><text class="small" x="625" y="354">LiDAR candidate</text><text class="small" x="625" y="382">inside lawn region</text>
  <rect class="semantic" x="790" y="320" width="220" height="92"/><text class="small" x="900" y="354">LiDAR candidate</text><text class="small" x="900" y="382">inside non-lawn region</text>
  <rect class="semantic" x="1065" y="320" width="220" height="92"/><text class="small" x="1175" y="350">Point cloud from</text><text class="small" x="1175" y="378">semantic non-lawn region</text>
  <rect class="discard" x="520" y="472" width="210" height="58"/><text class="label" x="625" y="509">Discard</text>

  <!-- Detection filtering -->
  <rect class="assoc" x="770" y="565" width="660" height="72"/><text class="label" x="1100" y="609">Project retained geometry into object detections</text>
  <rect class="filter" x="745" y="704" width="340" height="158"/>
  <text class="small" x="915" y="738">Outside detection box</text><text class="tiny" x="915" y="772">2 cm &lt; height &lt; 20 cm</text><text class="tiny" x="915" y="800">lawn height &gt; 30 cm</text><text class="tiny" x="915" y="828">cluster to reject anomalous points</text>
  <rect class="filter" x="1120" y="704" width="340" height="158"/>
  <text class="small" x="1290" y="738">Inside detection box</text><text class="tiny" x="1290" y="779">point-cloud height &lt; 20 cm</text><text class="tiny" x="1290" y="809">cluster non-lawn points</text><text class="tiny" x="1290" y="837">to reject anomalies</text>

  <!-- Association and outputs -->
  <rect class="assoc" x="365" y="912" width="950" height="76"/><text class="label" x="840" y="944">Associate geometry with object detections</text><text class="tiny" x="840" y="972">Preserve LiDAR support, semantic region, and visual class</text>
  <rect class="output" x="70" y="1030" width="430" height="66"/><text class="title" x="285" y="1071">GEOMETRY-ONLY OBSTACLE</text>
  <rect class="output" x="685" y="1030" width="430" height="66"/><text class="title" x="900" y="1058">CLASS-ASSOCIATED</text><text class="title" x="900" y="1083">OBSTACLE</text>
  <rect class="output" x="1300" y="1030" width="430" height="66"/><text class="title" x="1515" y="1058">VISION-ONLY ESTIMATED</text><text class="title" x="1515" y="1083">OBSTACLE</text>

  <!-- LiDAR gate: YES down, NO right -->
  <path class="line" d="M237 116V160"/>
  <path class="line" d="M143 286V374"/><text class="branch" x="86" y="345">YES</text>
  <path class="line" d="M331 286V300H510V209H545"/><text class="branch" x="382" y="291">NO</text>
  <path class="line" d="M900 116V170"/>

  <!-- Semantic fan-out uses aligned ports -->
  <path class="line" d="M625 248V320"/><path class="line" d="M900 248V320"/><path class="line" d="M1175 248V320"/>
  <path class="line" d="M625 412V472"/>

  <!-- Retained LiDAR and semantic points enter the detection stage in source order -->
  <path class="feed" d="M900 412V520H930V565"/>
  <path class="feed" d="M1175 412V520H1190V565"/>
  <path class="feed" d="M1562 116V601H1430"/>
  <path class="line" d="M980 637V670H915V704"/><path class="line" d="M1220 637V670H1290V704"/>

  <!-- Association inputs maintain their left-to-right ordering -->
  <path class="feed" d="M237 454V882H500V912"/>
  <path class="feed" d="M915 862V888H760V912"/>
  <path class="feed" d="M1290 862V888H1040V912"/>

  <!-- Associated outputs and isolated vision-only rail -->
  <path class="line" d="M650 988V1008H285V1030"/><path class="line" d="M900 988V1030"/>
  <path class="dash" d="M1745 77H1772V1008H1515V1030"/>
  <rect class="route-note" x="1320" y="986" width="390" height="36"/>
  <text class="tiny" x="1515" y="1010">Detections without LiDAR or semantic support</text>
</svg>
