<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Multi-sensor obstacle fusion pipeline</title>
  <desc id="desc">Flowchart showing how LiDAR obstacles, semantic segmentation, and object detections are projected and associated into geometry-only, class-associated, and vision-only obstacle outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="lidar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075f82"/><stop offset="1" stop-color="#168ea8"/></linearGradient>
    <linearGradient id="vision" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#394bb4"/><stop offset="1" stop-color="#6a55c8"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#052b49"/><stop offset="1" stop-color="#0c6076"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0b3655" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b5578"/></marker>
    <style>
      .input-lidar{fill:url(#lidar);stroke:#fff;stroke-width:2;rx:16;filter:url(#shadow)}
      .input-vision{fill:url(#vision);stroke:#fff;stroke-width:2;rx:16;filter:url(#shadow)}
      .node{fill:#fff;stroke:#719bb8;stroke-width:2;rx:13;filter:url(#shadow)}
      .semantic{fill:#f5f2ff;stroke:#8174cf;stroke-width:2;rx:13}
      .geometry{fill:#eefbff;stroke:#2aa4c2;stroke-width:2;rx:13}
      .filter{fill:#fffaf0;stroke:#d7a844;stroke-width:2;rx:13}
      .discard{fill:#fff4f2;stroke:#d67868;stroke-width:2;rx:13}
      .assoc{fill:#eaf7ff;stroke:#2588bc;stroke-width:2.5;rx:15;filter:url(#shadow)}
      .output{fill:url(#result);stroke:#72d7e8;stroke-width:2;rx:16;filter:url(#shadow)}
      .line{fill:none;stroke:#1b5578;stroke-width:3;marker-end:url(#arrow)}
      .feed{fill:none;stroke:#477795;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7f91a0;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .title{font:700 25px Inter,Arial,sans-serif;fill:#fff;text-anchor:middle}
      .label{font:700 23px Inter,Arial,sans-serif;fill:#14384f;text-anchor:middle}
      .small{font:600 19px Inter,Arial,sans-serif;fill:#294b61;text-anchor:middle}
      .tiny{font:600 16px Inter,Arial,sans-serif;fill:#496779;text-anchor:middle}
      .branch{font:700 18px Inter,Arial,sans-serif;fill:#126b8d}
      .group-title{font:700 18px Inter,Arial,sans-serif;letter-spacing:2px;fill:#337393}
    </style>
  </defs>

  <rect width="1800" height="1120" rx="28" fill="url(#bg)"/>

  <rect class="input-lidar" x="58" y="42" width="370" height="82"/>
  <text class="title" x="243" y="92">LIDAR RESULTS</text>
  <rect class="input-vision" x="716" y="42" width="370" height="82"/>
  <text class="title" x="901" y="92">SEMANTIC SEGMENTATION</text>
  <rect class="input-vision" x="1372" y="42" width="370" height="82"/>
  <text class="title" x="1557" y="92">OBJECT DETECTIONS</text>

  <polygon class="geometry" points="243,174 433,258 243,342 53,258"/>
  <text class="small" x="243" y="235">Pit detected, footprint &gt; 2 m,</text>
  <text class="small" x="243" y="264">or height &gt; 30 cm?</text>

  <rect class="geometry" x="58" y="396" width="340" height="86"/>
  <text class="label" x="228" y="432">Protected LiDAR obstacle</text>
  <text class="tiny" x="228" y="459">Retain as geometric hazard</text>

  <rect class="semantic" x="555" y="214" width="470" height="82"/>
  <text class="label" x="790" y="250">Project LiDAR into semantic mask</text>
  <text class="tiny" x="790" y="277">Evaluate lawn / non-lawn support</text>

  <rect class="semantic" x="478" y="363" width="292" height="105"/>
  <text class="small" x="624" y="402">LiDAR candidate</text>
  <text class="small" x="624" y="430">inside lawn region</text>
  <rect class="discard" x="498" y="512" width="252" height="62"/>
  <text class="label" x="624" y="551">Discard</text>

  <rect class="semantic" x="810" y="363" width="292" height="105"/>
  <text class="small" x="956" y="402">LiDAR candidate</text>
  <text class="small" x="956" y="430">inside non-lawn region</text>

  <rect class="semantic" x="1142" y="363" width="330" height="105"/>
  <text class="small" x="1307" y="399">Point cloud sampled from</text>
  <text class="small" x="1307" y="428">semantic non-lawn region</text>

  <rect class="assoc" x="1050" y="520" width="500" height="70"/>
  <text class="label" x="1300" y="563">Project into object detections</text>

  <rect class="filter" x="940" y="635" width="345" height="174"/>
  <text class="small" x="1112" y="672">Outside detection box</text>
  <text class="tiny" x="1112" y="706">2 cm &lt; point-cloud height &lt; 20 cm</text>
  <text class="tiny" x="1112" y="735">lawn height &gt; 30 cm</text>
  <text class="tiny" x="1112" y="764">cluster large point sets to</text>
  <text class="tiny" x="1112" y="790">remove anomalous points</text>

  <rect class="filter" x="1320" y="635" width="345" height="174"/>
  <text class="small" x="1492" y="672">Inside detection box</text>
  <text class="tiny" x="1492" y="711">point-cloud height &lt; 20 cm</text>
  <text class="tiny" x="1492" y="744">cluster non-lawn points to</text>
  <text class="tiny" x="1492" y="773">remove anomalous points</text>

  <rect class="assoc" x="477" y="865" width="870" height="82"/>
  <text class="label" x="912" y="901">Associate geometry with object detections</text>
  <text class="tiny" x="912" y="929">Preserve LiDAR support, semantic region, and visual class</text>

  <rect class="output" x="58" y="1010" width="430" height="78"/>
  <text class="title" x="273" y="1058">GEOMETRY-ONLY OBSTACLE</text>
  <rect class="output" x="685" y="1010" width="430" height="78"/>
  <text class="title" x="900" y="1045">CLASS-ASSOCIATED</text>
  <text class="title" x="900" y="1073">OBSTACLE</text>
  <rect class="output" x="1312" y="1010" width="430" height="78"/>
  <text class="title" x="1527" y="1045">VISION-ONLY ESTIMATED</text>
  <text class="title" x="1527" y="1073">OBSTACLE</text>

  <path class="line" d="M243 124 V174"/>
  <path class="line" d="M148 300 V396"/>
  <text class="branch" x="102" y="355">YES</text>
  <path class="line" d="M338 300 V332 H555 V255"/>
  <text class="branch" x="382" y="324">NO</text>
  <path class="line" d="M901 124 V214"/>

  <path class="line" d="M690 296 V329 H624 V363"/>
  <path class="line" d="M790 296 V363"/>
  <path class="line" d="M890 296 V329 H1307 V363"/>
  <path class="line" d="M624 468 V512"/>
  <path class="feed" d="M956 468 V825 H805 V865"/>
  <path class="line" d="M1307 468 V520"/>
  <path class="line" d="M1225 590 V615 H1112 V635"/>
  <path class="line" d="M1375 590 V615 H1492 V635"/>

  <path class="feed" d="M1557 124 V555 H1550"/>
  <path class="feed" d="M1557 124 H1720 V906 H1347"/>
  <path class="feed" d="M228 482 V835 H650 V865"/>
  <path class="feed" d="M1112 809 V838 H930 V865"/>
  <path class="feed" d="M1492 809 V838 H1195 V865"/>

  <path class="line" d="M730 947 V980 H273 V1010"/>
  <path class="line" d="M912 947 V1010"/>
  <path class="dash" d="M1557 124 H1760 V970 H1527 V1010"/>
  <text class="tiny" x="1580" y="970">detections without LiDAR or semantic support</text>
</svg>
