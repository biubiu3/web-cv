<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Terrain-aware point-cloud obstacle detection pipeline</title>
  <desc id="desc">Flowchart from point-cloud preprocessing through anomaly extraction, terrain and pit analysis, obstacle clustering and tracking, and publication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6f91"/>
      <stop offset="1" stop-color="#2456c4"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052b49"/>
      <stop offset="1" stop-color="#0c5b75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0b3655" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b5578"/>
    </marker>
    <style>
      .group{fill:#fff;fill-opacity:.76;stroke:#83a9c2;stroke-width:2;stroke-dasharray:10 8}
      .node{fill:#fff;stroke:#75a1bd;stroke-width:2;rx:13;filter:url(#shadow)}
      .mode{fill:#eefaff;stroke:#2da6c5;stroke-width:2;rx:13}
      .metric{fill:#f7f9ff;stroke:#7d8fd4;stroke-width:2;rx:13}
      .process{fill:#eff8ff;stroke:#3e86b0;stroke-width:2;rx:13}
      .final{fill:#fff;stroke:#2b81a8;stroke-width:2;rx:13}
      .input{fill:url(#primary);stroke:#ffffff;stroke-width:2;rx:15;filter:url(#shadow)}
      .output{fill:url(#result);stroke:#72d7e8;stroke-width:2;rx:15;filter:url(#shadow)}
      .line{fill:none;stroke:#1b5578;stroke-width:3;marker-end:url(#arrow)}
      .feed{fill:none;stroke:#2c789d;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#12364e;text-anchor:middle}
      .small{font:600 21px Inter,Arial,sans-serif;fill:#244a62;text-anchor:middle}
      .tiny{font:600 17px Inter,Arial,sans-serif;fill:#426277;text-anchor:middle}
      .light{fill:#fff}
      .group-title{font:700 18px Inter,Arial,sans-serif;letter-spacing:2px;fill:#337393}
      .branch{font:700 18px Inter,Arial,sans-serif;fill:#126b8d}
    </style>
  </defs>

  <rect width="1800" height="1040" rx="28" fill="url(#bg)"/>

  <rect class="input" x="65" y="36" width="300" height="70"/>
  <text class="label light" x="215" y="80">POINT-CLOUD INPUT</text>

  <rect class="group" x="40" y="145" width="350" height="274" rx="22"/>
  <text class="group-title" x="62" y="176">PREPROCESSING</text>
  <rect class="node" x="75" y="194" width="280" height="55"/>
  <text class="small" x="215" y="229">Pass-through filtering</text>
  <rect class="node" x="75" y="268" width="280" height="55"/>
  <text class="small" x="215" y="303">Grid projection</text>
  <rect class="node" x="75" y="342" width="280" height="55"/>
  <text class="small" x="215" y="377">Max points per cell</text>

  <rect class="group" x="40" y="470" width="520" height="356" rx="22"/>
  <text class="group-title" x="62" y="501">ANOMALY EXTRACTION</text>
  <rect class="node" x="118" y="520" width="360" height="61"/>
  <text class="small" x="298" y="558">Extract anomalous grid points</text>
  <rect class="node" x="118" y="612" width="360" height="92"/>
  <text class="small" x="298" y="648">Cluster anomalous points</text>
  <text class="tiny" x="298" y="677">cluster size &gt; 30 points?</text>
  <rect class="process" x="72" y="749" width="210" height="55"/>
  <text class="small" x="177" y="784">Anomalous cells</text>
  <rect class="process" x="322" y="749" width="210" height="55"/>
  <text class="small" x="427" y="784">Regular cells</text>

  <rect class="group" x="638" y="86" width="590" height="498" rx="22"/>
  <text class="group-title" x="660" y="117">TERRAIN-MODE ANALYSIS</text>
  <rect class="mode" x="675" y="155" width="205" height="64"/>
  <text class="small" x="777" y="194">Lawn mode</text>
  <rect class="mode" x="675" y="240" width="205" height="64"/>
  <text class="small" x="777" y="279">Flat-ground mode</text>
  <rect class="metric" x="938" y="137" width="255" height="72"/>
  <text class="small" x="1065" y="180">Lawn height estimate</text>
  <rect class="metric" x="938" y="229" width="255" height="78"/>
  <text class="small" x="1065" y="260">Absolute cell height</text>
  <text class="tiny" x="1065" y="286">&gt; 35 cm</text>
  <rect class="metric" x="938" y="327" width="255" height="78"/>
  <text class="small" x="1065" y="358">Relative cell height</text>
  <text class="tiny" x="1065" y="384">&gt; 16 cm</text>
  <rect class="metric" x="938" y="425" width="255" height="72"/>
  <text class="small" x="1065" y="469">Cell flatness estimate</text>

  <rect class="group" x="638" y="630" width="410" height="278" rx="22"/>
  <text class="group-title" x="660" y="661">LOCAL SURFACE CHECK</text>
  <rect class="node" x="681" y="684" width="324" height="58"/>
  <text class="small" x="843" y="720">Fit local ground plane</text>
  <rect class="node" x="681" y="762" width="324" height="72"/>
  <text class="small" x="843" y="793">Pit cell lies below plane</text>
  <text class="tiny" x="843" y="818">by more than 7 cm</text>
  <rect class="node" x="681" y="854" width="324" height="38"/>
  <text class="tiny" x="843" y="879">Connect neighboring pit cells</text>

  <rect class="group" x="1275" y="310" width="475" height="568" rx="22"/>
  <text class="group-title" x="1297" y="341">OBSTACLE REFINEMENT</text>
  <rect class="final" x="1320" y="373" width="385" height="64"/>
  <text class="small" x="1512" y="413">Add lawn around obstacles</text>
  <rect class="final" x="1320" y="458" width="385" height="64"/>
  <text class="small" x="1512" y="498">Add nearby anomalous points</text>
  <rect class="final" x="1320" y="543" width="385" height="64"/>
  <text class="small" x="1512" y="583">Cluster obstacle cells</text>
  <rect class="final" x="1320" y="628" width="385" height="64"/>
  <text class="small" x="1512" y="668">Track obstacles over time</text>
  <rect class="final" x="1320" y="713" width="385" height="64"/>
  <text class="small" x="1512" y="753">Remove lawn support</text>

  <rect class="output" x="1320" y="925" width="385" height="72"/>
  <text class="label light" x="1512" y="970">PUBLISH OBSTACLES</text>

  <path class="line" d="M215 106 V194"/>
  <path class="line" d="M215 249 V268"/>
  <path class="line" d="M215 323 V342"/>
  <path class="line" d="M215 397 V520"/>
  <path class="line" d="M298 581 V612"/>
  <path class="line" d="M238 704 V724 H177 V749"/>
  <text class="branch" x="137" y="728">NO</text>
  <path class="line" d="M358 704 V724 H427 V749"/>
  <text class="branch" x="441" y="728">YES</text>

  <path class="line" d="M532 777 H594 V187 H675"/>
  <path class="line" d="M532 777 H612 V272 H675"/>
  <path class="feed" d="M880 187 C904 187 914 173 938 173"/>
  <path class="feed" d="M880 187 C908 187 912 268 938 268"/>
  <path class="feed" d="M880 187 C908 187 912 366 938 366"/>
  <path class="feed" d="M880 187 C908 187 912 461 938 461"/>
  <path class="feed" d="M880 272 C908 272 912 268 938 268"/>
  <path class="feed" d="M880 272 C908 272 912 366 938 366"/>
  <path class="feed" d="M880 272 C908 272 912 461 938 461"/>

  <path class="line" d="M532 777 H681"/>
  <path class="line" d="M843 742 V762"/>
  <path class="line" d="M843 834 V854"/>

  <path class="feed" d="M1193 173 H1244 V405 H1320"/>
  <path class="feed" d="M1193 268 H1252 V575 H1320"/>
  <path class="feed" d="M1193 366 H1260 V575 H1320"/>
  <path class="feed" d="M1193 461 H1268 V575 H1320"/>
  <path class="feed" d="M282 777 V866 H1240 V490 H1320"/>
  <path class="feed" d="M1005 873 H1220 V490 H1320"/>

  <path class="line" d="M1512 437 V458"/>
  <path class="line" d="M1512 522 V543"/>
  <path class="line" d="M1512 607 V628"/>
  <path class="line" d="M1512 692 V713"/>
  <path class="line" d="M1512 777 V925"/>
</svg>
