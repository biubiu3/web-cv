<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Terrain-aware point-cloud obstacle detection pipeline</title>
  <desc id="desc">A left-to-right flowchart. Point-cloud preprocessing separates anomalous and regular cells. Regular cells support terrain-mode and local-surface analysis. Terrain evidence, anomalous cells, and connected pit cells then enter a linear obstacle-refinement chain before publication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087799"/><stop offset="1" stop-color="#2858bd"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05324e"/><stop offset="1" stop-color="#08708a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b3655" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c587b"/></marker>
    <style>
      .group{fill:#fff;fill-opacity:.77;stroke:#83a9c2;stroke-width:2;stroke-dasharray:10 8}.node{fill:#fff;stroke:#76a0bc;stroke-width:2;rx:13;filter:url(#shadow)}.mode{fill:#eefaff;stroke:#28a5c6;stroke-width:2;rx:13}.metric{fill:#f7f8ff;stroke:#798bd2;stroke-width:2;rx:13}.process{fill:#eef8ff;stroke:#3686b2;stroke-width:2;rx:13}.final{fill:#fff;stroke:#2b81a8;stroke-width:2;rx:13}.input{fill:url(#primary);stroke:#fff;stroke-width:2;rx:15;filter:url(#shadow)}.output{fill:url(#result);stroke:#72d7e8;stroke-width:2;rx:15;filter:url(#shadow)}.decision{fill:#f3fbff;stroke:#28a5c6;stroke-width:2}.line{fill:none;stroke:#1c587b;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.feed{fill:none;stroke:#397795;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.wire{fill:none;stroke:#397795;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.junction{fill:#fff;stroke:#1c587b;stroke-width:2}.label{font:700 27px Inter,Arial,sans-serif;fill:#12364e;text-anchor:middle}.small{font:650 22px Inter,Arial,sans-serif;fill:#244a62;text-anchor:middle}.tiny{font:600 18px Inter,Arial,sans-serif;fill:#426277;text-anchor:middle}.light{fill:#fff}.group-title{font:750 20px Inter,Arial,sans-serif;letter-spacing:2px;fill:#337393}.branch{font:750 19px Inter,Arial,sans-serif;fill:#126b8d}.chip{fill:#e8f5fb;stroke:#8cb4c9;stroke-width:1.4;rx:8}.chip-text{font:700 16px Inter,Arial,sans-serif;fill:#356277;text-anchor:middle}
    </style>
  </defs>
  <rect width="1800" height="1080" rx="28" fill="url(#bg)"/>

  <rect class="input" x="72" y="34" width="330" height="72"/><text class="label light" x="237" y="79">POINT-CLOUD INPUT</text>
  <rect class="group" x="40" y="140" width="395" height="250" rx="22"/><text class="group-title" x="62" y="174">01 · PREPROCESSING</text>
  <rect class="node" x="82" y="194" width="310" height="54"/><text class="small" x="237" y="228">Pass-through filtering</text>
  <rect class="node" x="82" y="267" width="310" height="54"/><text class="small" x="237" y="301">Grid projection</text>
  <rect class="node" x="82" y="340" width="310" height="54"/><text class="small" x="237" y="374">Max points per cell</text>

  <rect class="group" x="40" y="430" width="395" height="500" rx="22"/><text class="group-title" x="62" y="464">02 · ANOMALY EXTRACTION</text>
  <rect class="node" x="82" y="490" width="310" height="58"/><text class="small" x="237" y="526">Extract anomalous grid points</text>
  <rect class="node" x="82" y="582" width="310" height="64"/><text class="small" x="237" y="621">Cluster anomalous points</text>
  <polygon class="decision" points="237,684 370,754 237,824 104,754"/>
  <text class="small" x="237" y="746">Cluster contains</text><text class="small" x="237" y="773">more than 30 points?</text>
  <rect class="process" x="55" y="852" width="165" height="56"/><text class="small" x="137" y="887">Anomalous cells</text>
  <rect class="process" x="255" y="852" width="165" height="56"/><text class="small" x="337" y="887">Regular cells</text>

  <rect class="group" x="520" y="118" width="610" height="510" rx="22"/><text class="group-title" x="544" y="152">03 · TERRAIN-MODE ANALYSIS</text>
  <rect class="mode" x="558" y="200" width="220" height="66"/><text class="small" x="668" y="241">Lawn mode</text>
  <rect class="mode" x="558" y="350" width="220" height="66"/><text class="small" x="668" y="391">Flat-ground mode</text>
  <rect class="metric" x="825" y="185" width="265" height="96"/><text class="small" x="957" y="222">Lawn height estimate</text><text class="tiny" x="957" y="253">relative height &gt; 16 cm</text>
  <rect class="metric" x="825" y="335" width="265" height="96"/><text class="small" x="957" y="372">Absolute height &gt; 35 cm</text><text class="tiny" x="957" y="403">cell flatness estimate</text>
  <rect class="process" x="674" y="535" width="300" height="56"/><text class="small" x="824" y="570">Terrain evidence</text>

  <rect class="group" x="520" y="664" width="610" height="266" rx="22"/><text class="group-title" x="544" y="698">04 · LOCAL SURFACE CHECK</text>
  <rect class="node" x="615" y="724" width="420" height="54"/><text class="small" x="825" y="758">Fit local ground plane</text>
  <rect class="node" x="615" y="800" width="420" height="62"/><text class="small" x="825" y="827">Pit cell lies below the plane</text><text class="tiny" x="825" y="851">by more than 7 cm</text>
  <rect class="node" x="615" y="884" width="420" height="46"/><text class="tiny" x="825" y="913">Connect neighboring pit cells</text>

  <rect class="group" x="1240" y="118" width="515" height="812" rx="22"/><text class="group-title" x="1264" y="152">05 · OBSTACLE REFINEMENT</text>
  <rect class="final" x="1285" y="200" width="425" height="66"/><text class="small" x="1497" y="227">Seed candidates from</text><text class="tiny" x="1497" y="251">height, flatness, and terrain mode</text>
  <rect class="final" x="1285" y="302" width="425" height="62"/><text class="small" x="1497" y="341">Add lawn support around obstacles</text>
  <rect class="final" x="1285" y="400" width="425" height="66"/><text class="small" x="1497" y="427">Merge anomalous and</text><text class="small" x="1497" y="453">connected pit cells</text>
  <rect class="final" x="1285" y="502" width="425" height="62"/><text class="small" x="1497" y="541">Cluster obstacle cells</text>
  <rect class="final" x="1285" y="600" width="425" height="62"/><text class="small" x="1497" y="639">Track obstacles over time</text>
  <rect class="final" x="1285" y="698" width="425" height="62"/><text class="small" x="1497" y="737">Remove lawn support</text>
  <rect class="output" x="1285" y="834" width="425" height="70"/><text class="label light" x="1497" y="878">PUBLISH OBSTACLES</text>

  <path class="line" d="M237 106V194"/><path class="line" d="M237 248V267"/><path class="line" d="M237 321V340"/><path class="line" d="M237 394V490"/><path class="line" d="M237 548V582"/><path class="line" d="M237 646V684"/>
  <path class="line" d="M154 798V826H137V852"/><text class="branch" x="92" y="827">NO</text>
  <path class="line" d="M320 798V826H337V852"/><text class="branch" x="352" y="827">YES</text>

  <path class="wire" d="M420 880H474V233"/><circle class="junction" cx="474" cy="880" r="5"/>
  <path class="feed" d="M474 233H558"/><path class="feed" d="M474 383H558"/>
  <path class="feed" d="M474 880H570V751H615"/>

  <path class="line" d="M778 233H825"/><path class="line" d="M778 383H825"/>
  <path class="feed" d="M957 281V305H1110V500H914V535"/>
  <path class="feed" d="M957 431V470H734V535"/>

  <path class="line" d="M825 778V800"/><path class="line" d="M825 862V884"/>
  <path class="line" d="M974 563H1160V233H1285"/>
  <path class="line" d="M1497 266V302"/><path class="line" d="M1497 364V400"/><path class="line" d="M1497 466V502"/><path class="line" d="M1497 564V600"/><path class="line" d="M1497 662V698"/><path class="line" d="M1497 760V834"/>

  <path class="wire" d="M137 908V982H1220V433"/>
  <path class="wire" d="M1035 907H1178V956H1220"/>
  <circle class="junction" cx="1220" cy="433" r="6"/><path class="feed" d="M1220 433H1285"/>
</svg>
