bio: |
  I am Nie Chang (聂畅), a final-year Ph.D. student at the School of Automation
  and Intelligent Sensing, Shanghai Jiao Tong University, advised by
  [Prof. Hesheng Wang](https://sais.sjtu.edu.cn/faculty/wanghesheng.html).
  I study how robots use language, multisensory observations, and physical
  feedback to select and improve their actions. My work covers agentic robot
  learning, LLM/VLM reasoning, Vision-Language-Action models, and robot training
  data. I aim to build robots that learn from sparse demonstrations and reuse
  experience across tasks.

  I am seeking research, engineering, and postdoctoral opportunities worldwide.
  Please get in touch if you would like to discuss research or collaboration.

