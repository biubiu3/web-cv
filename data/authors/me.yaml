bio: |
  I am Nie Chang (聂畅), a final-year Ph.D. student at the School of Automation
  and Intelligent Sensing, Shanghai Jiao Tong University, advised by
  [Prof. Hesheng Wang](https://sais.sjtu.edu.cn/faculty/wanghesheng.html).
  My research focuses on Physical AI and embodied intelligence, spanning model
  architecture, multimodal foundation-model training, and AI-agent-driven
  robotic systems. I explore how multimodal models and agentic systems can
  improve robot policies and architectures, with the long-term goal of building
  general and adaptable robot systems.

  I value ambitious, collaborative research environments and pursue work with
  real-world impact. I am currently exploring research and engineering roles as
  well as postdoctoral opportunities worldwide. If our interests overlap, please
  feel free to get in touch.

