bio: |
  I am Nie Chang (聂畅), a Ph.D. candidate at the School of Automation and
  Intelligent Sensing, Shanghai Jiao Tong University, advised by
  [Prof. Hesheng Wang](https://sais.sjtu.edu.cn/faculty/wanghesheng.html).
  My research bridges **Physical AI, Embodied Foundation Models (VLA), and
  Autonomous Robotics Systems**—empowering robots to perceive across complex
  modalities, reason causally about physical interactions, and continuously
  accumulate reusable skills through real-world experience.

  My work spans the full spectrum from foundational machine learning theory to
  mass-production real-robot deployment:
  - **Embodied AI & Multimodal Agents**: Pioneered continuous audio-visual-action
    learning (**HEAR**, IJRR 2026), lifelong agentic robot learning with persistent
    memory (**TGL**), and action-conditioned 4D robotic world models (**ERMV**).
  - **High-Precision Visual Geometry & Spatial Intelligence**: Developed
    diffusion-guided robust consensus (**DiffSAC**), embedded 3D Gaussian
    Splatting SLAM (**VCGS-SLAM**, IJCV 2026), multi-camera SfM (**MRASfM**, ICRA 2026),
    and RL-driven geometric estimation (**RLSAC**, ICCV 2023).
  - **Full-Stack Robotics Deployment**: Led large-scale engineering programs
    including commercial campus Autonomous Valet Parking (**AVP** with Ingeek),
    mass-production autonomous lawn mowers (**Positec**), industrial-scale 4D
    auto-labeling (**Hozon Auto**), and dual-arm mobile manipulation for chemistry labs.

  I am actively seeking research scientist, staff engineering, and postdoctoral
  opportunities worldwide across Physical AI, Embodied Intelligence, and Robotics.
  Let's connect and build the next generation of intelligent physical systems together!

