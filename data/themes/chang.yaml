hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Chang Quantum"
    vendor: "Nie Chang"
    version: "2.0.0"
    license: "MIT"

  type: "dual"

  light:
    colors:
      primary: "cyan"
      secondary: "indigo"
    surfaces:
      background: "#f3f8fc"
      foreground: "#0b1f38"
      header:
        background: "#f7fbfe"
        foreground: "#071a33"
      footer:
        background: "#e9f2f9"
        foreground: "#0b1f38"

  dark:
    colors:
      primary: "cyan"
      secondary: "violet"
    surfaces:
      background: "#050c18"
      foreground: "#dceaf7"
      header:
        background: "#071324"
        foreground: "#edf8ff"
      footer:
        background: "#030914"
        foreground: "#d7e7f4"
