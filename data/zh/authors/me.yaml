bio: |
  我是聂畅，上海交通大学自动化与感知学院最后一年的博士生，师从
  [王贺升教授](https://sais.sjtu.edu.cn/faculty/wanghesheng.html)。我的研究面向
  **物理 AI 与具身智能**，探索如何将语言、多模态感知与物理行动连接成通用
  机器人系统。具体方向包括智能体机器人学习、LLM/VLM 推理、视觉-语言-动作
  模型、多感官策略，以及机器人经验的生成与理解。长期目标是构建能够从少量示教
  中学习、基于物理反馈推理，并跨任务复用经验的适应性机器人。

  我希望在富有挑战、重视协作的环境中开展具有现实影响力的研究。目前正在寻找全球
  范围内的研究、工程和博士后机会；如果我们的研究兴趣有所交集，欢迎随时联系我。
