bio: |
  我是聂畅，上海交通大学自动化与感知学院博士生，即将毕业，师从
  [王贺升教授](https://sais.sjtu.edu.cn/faculty/wanghesheng.html)。我研究机器人如何
  利用语言、多感官观测和物理反馈选择并改进动作。具体方向包括智能体机器人学习、
  LLM/VLM 推理、视觉语言动作模型和机器人训练数据。我希望机器人能够从少量
  示教中学习，并在不同任务之间复用经验。

  我正在寻找全球范围内的研究、工程和博士后机会，欢迎联系我交流研究与合作。
