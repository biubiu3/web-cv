bio: |
  我是聂畅，上海交通大学自动化与感知学院博士候选人，师从
  [王贺升教授](https://sais.sjtu.edu.cn/faculty/wanghesheng.html)。我的研究聚焦于
  **物理 AI（Physical AI）、具身基础模型（VLA）与全栈自主机器人系统**——致力于让机器人跨越固定、单次策略的局限，成为具备多模态因果感知、物理常识推理并能在真实环境中终身自主进化的高阶智能体。

  我的工作横跨基础前沿算法与工业级实车/机器人落地全链路：
  - **具身智能与多模态智能体**：首创连续音频-视觉-动作操作范式（**HEAR**，机器人旗舰期刊 IJRR 2026）、提出具备终身记忆与自愈能力的智能体学习架构（**TGL**，IEEE T-RO 审稿中），以及 4D 生成式轨迹编辑框架（**ERMV**）。
  - **高精度空间几何与环境感知**：开创扩散引导的采样一致性估计（**DiffSAC**，IJCV 审稿中）、嵌入式 3D 高斯 SLAM 系统（**VCGS-SLAM**，IJCV 2026）、自动驾驶多相机 SfM 与场景聚合（**MRASfM**，ICRA 2026，nuScenes 排名第一），以及强化学习几何估计（**RLSAC**，ICCV 2023）。
  - **工业级全栈机器人研发与实车交付**：作为项目负责人与核心架构师，主导了面向量产的园区自主代客泊车（**AVP**，联合寅家科技）、量产级智能割草机器人（联合宝时得）、自动驾驶 4D 自动标注平台（联合哪吒汽车），以及服务于 AI for Science 的双臂移动化学家机器人。

  我正在寻找全球顶尖的科研机构、前沿工业实验室及博士后研究机会（Embodied AI / Robotics / Autonomous Driving）。欢迎交流探讨，共同开拓物理智能的未来！
