bio: |
  我是聂畅，上海交通大学自动化与感知学院最后一年的博士生，师从
  [王贺升教授](https://sais.sjtu.edu.cn/faculty/wanghesheng.html)。我的研究聚焦
  **物理 AI 与具身智能**，覆盖模型架构、多模态基础模型训练，以及 AI Agent
  驱动的机器人系统。我希望通过多模态模型与智能体系统改进机器人策略和模型架构，
  长期目标是构建通用、可适应、能够持续成长的机器人系统。

  我重视高质量的协作环境与具有现实影响力的研究成果。目前我正在寻找全球范围内的
  研究、工程和博士后机会；如果我们的研究兴趣有所交集，欢迎随时联系我。
